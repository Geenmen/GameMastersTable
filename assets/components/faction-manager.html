    <!-- Faction List -->
    <div class="facman-faction-list">
        <!-- Faction buttons will be appended here -->
    </div>

    <!-- Modal for creating factions -->
    <div class="facman-modal" id="facman-modal">
        <div class="facman-modal-content">
            <button class="facman-modal-close-btn" id="facman-modal-close-btn">✖</button>
            <div id="facman-modal-body">

        </div>
    </div>

    <!-- Faction Card -->
    <div class="facman-faction-card" id="facman-faction-card">
        <!-- Faction details will be injected here -->
    </div>
</div>
